name: offline-regression
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  release-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      - name: Run free release preflight tests
        run: python -m unittest discover -s scripts/tests -v
      - name: Inspect tracked files (heuristic only)
        run: python scripts/check_release_safety.py --require-locks
      - name: Validate local Compose structure without credentials
        run: |
          cp backend/.env.example backend/.env
          docker compose config -q
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: '0.12.7'
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - run: uv python install 3.14
      - name: Backend pytest (offline, real model not called)
        run: uv run --locked --python 3.14 pytest -q
      - name: Deterministic evaluation (offline, 32 cases)
        run: uv run --locked --python 3.14 python -m evals.run offline
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@v7.1.0 # immutable release
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run test:unit
      - run: npm run build
